name: Publish GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.7.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7.0
          name: v1.7.0
          generate_release_notes: false
          body: |
            ## Thinking Mode Auto-On for Gemini App v1.7.0

            Chrome extension that auto-enables Gemini Extended Thinking mode on gemini.google.com.

            ### Changes in v1.7.0
            - Removed log viewing/downloading from the popup (privacy hardening)
            - Extension no longer collects or stores operation logs; popup shows status only
            - Updated privacy policy

            ### Features
            - Auto-enable Extended Thinking on page load
            - Persist preference via L5adhe (level 2)
            - UI sync with chip success check
            - Skip menu interaction when already enabled
            - Respect manual off within the same tab session
            - One-time ToS / privacy policy consent gate
            - Popup: status view (no logs)

            ### Install
            1. Clone this repository
            2. Open chrome://extensions and enable Developer mode
            3. Load unpacked and select the `extension/` folder

            See the README for details.

            ### Notes
            - Unofficial tool; not affiliated with Google/Gemini
            - Use at your own risk
            - May break when Gemini UI/RPC changes
