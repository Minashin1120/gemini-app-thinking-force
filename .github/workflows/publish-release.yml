name: Publish GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release v1.4.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: v1.4.0
          generate_release_notes: false
          body: |
            ## Gemini Extended Thinking Auto-On v1.4.0

            Chrome extension that auto-enables Gemini Extended Thinking mode on gemini.google.com.

            ### Changes
            - Faster auto-enable after page load
            - Start as soon as the model chip mounts (MutationObserver + early poll)
            - Write preference in parallel so UI enable is not blocked on network RTT
            - Shorter early debounce / throttle and confirmation waits

            ### Features
            - Auto-enable Extended Thinking on page load
            - Persist preference via L5adhe (level 2)
            - UI sync with chip success check
            - Skip menu interaction when already enabled
            - Popup: status + JSON log download

            ### Install
            1. Clone this repository
            2. Open chrome://extensions and enable Developer mode
            3. Load unpacked and select the `extension/` folder

            See the README for details.

            ### Notes
            - Unofficial tool; not affiliated with Google/Gemini
            - Use at your own risk
            - May break when Gemini UI/RPC changes
