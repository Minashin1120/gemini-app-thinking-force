<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thinking Mode Auto-On for Gemini App</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Thinking Mode Auto-On for Gemini App</h1>
      <p class="sub">ログと状態の確認 / ダウンロード</p>
    </header>

    <section class="consent card" id="consentView" hidden>
      <h2>同意が必要です</h2>
      <p>本拡張をご利用いただくには、下記の規約・ポリシーをご確認のうえ、同意してください。</p>
      <div class="consent-links">
        <button id="linkTerms" type="button">利用規約を開く</button>
        <button id="linkPrivacy" type="button">プライバシーポリシーを開く</button>
      </div>
      <div class="consent-actions">
        <button id="btnAgree" type="button" class="primary">同意して利用する</button>
        <button id="btnReject" type="button" class="ghost">同意しない</button>
      </div>
      <p class="note" id="consentNote"></p>
    </section>

    <div id="appView" hidden>
      <section class="status card">
        <div class="row">
          <span class="label">接続</span>
          <span id="conn" class="value">確認中…</span>
        </div>
        <div class="row">
          <span class="label">UI 有効化</span>
          <span id="domOk" class="value">—</span>
        </div>
        <div class="row">
          <span class="label">チップ表示</span>
          <span id="chip" class="value mono">—</span>
        </div>
        <div class="row">
          <span class="label">設定書き込み</span>
          <span id="prefOk" class="value">—</span>
        </div>
        <div class="row">
          <span class="label">ログ件数</span>
          <span id="logCount" class="value">0</span>
        </div>
        <div class="row">
          <span class="label">最終詳細</span>
          <span id="detail" class="value mono">—</span>
        </div>
      </section>

      <section class="actions">
        <button id="btnRefresh" type="button">更新</button>
        <button id="btnEnable" type="button" class="primary">今すぐ有効化</button>
        <button id="btnDownload" type="button" class="accent">ログをダウンロード</button>
        <button id="btnClear" type="button" class="ghost">ログクリア</button>
      </section>

      <section class="card">
        <div class="log-head">
          <strong>直近ログ</strong>
          <span id="logMeta" class="muted"></span>
        </div>
        <pre id="logView" class="log-view">読み込み中…</pre>
      </section>
    </div>

    <footer id="footerNote" class="muted">
      Gemini タブを開いた状態で使用してください。
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
